# Cuts a release: the tag, the notes, and the two files every release since 0.9.5 has
# carried — a single-file executable and a zip of that same executable.
#
# 0.9.8 shipped neither. It was the first release cut by this workflow, and the workflow
# built against a dynamic Qt: the result was a 21MB archive of Arbitrium.exe plus every
# Qt DLL, two D3D compilers nothing calls, and a stray .qt/ directory of CMake bookkeeping.
# Every release before it was one 34MB executable that needed nothing beside it. This
# builds that executable again, and the three things below exist so the shape cannot drift
# a second time:
#
#   * The build is a static Qt (MSYS2's mingw-w64-x86_64-qt6-static), which is what the
#     project has always been released from. Nothing else about CMakeLists.txt changes —
#     it already branches on whether Qt is static and skips windeployqt when it is.
#   * `objdump -p` reads the finished executable's import table back and looks every entry
#     up in the Windows system directory. Anything that is not part of Windows is something
#     the user would have to be handed as well, and fails the job. An earlier version of
#     this check listed names to reject instead — Qt, libgcc, libstdc++ — and duly passed a
#     build that wanted fourteen MSYS2 DLLs nobody had thought to name.
#   * The release is created *after* the build, in the same job that attaches the assets,
#     and the last step reads the asset list off the published release by name. The old
#     order — publish first, build second — is exactly how 0.9.8 came to exist with the
#     wrong payload and no error anywhere: a release that exists without its binary is
#     worse than a release that does not exist yet.
#
# The notes come from docs/release-notes/<tag>.md when that file exists and from the
# matching section of CHANGELOG.md when it does not, so a release never has to be written
# twice.
#
# `dry_run` builds and checks everything and publishes nothing. Run it before tagging.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.9.9. Created from the branch you run this on."
        required: true
        type: string
      dry_run:
        description: "Build and check the artefacts, publish nothing."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the tag and check the version agrees with it
        id: resolve
        shell: bash
        # Through the environment, not spliced into the script body: `tag` is free text a
        # dispatcher types, and text that reaches a shell by substitution is text that can
        # end the quoting around it.
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"

          # Matched against the tag, not against the version stripped out of it — `v` is
          # part of the shape being checked, and testing the remainder would have let a
          # bare "0.9.9" through to a workflow whose every other step assumes the prefix.
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$tag' is not a vMAJOR.MINOR.PATCH tag"; exit 1 ;;
          esac
          version="${tag#v}"

          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # The same guard CMake applies on a Windows configure. Catching a mismatch here
          # is cheaper than shipping an executable that disagrees with its own tag.
          project=$(sed -n 's/^project(Arbitrium VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "$project" != "$version" ]; then
            echo "::error::CMakeLists.txt says $project, the tag says $version"
            exit 1
          fi
          grep -q "\"FileVersion\",[^\"]*\"$version\"" app.rc \
            || { echo "::error::app.rc does not carry $version"; exit 1; }
          grep -q "^FILEVERSION *${version//./,},0" app.rc \
            || { echo "::error::app.rc FILEVERSION is not ${version//./,},0"; exit 1; }
          grep -q "version=\"$version\.0\"" resources/Arbitrium.manifest \
            || { echo "::error::the manifest does not carry $version.0"; exit 1; }
          echo "version $version checks out in all three files"

      # Collected here rather than in `publish`, and carried between the two as an
      # artefact. Doing it in both places meant two implementations of "are there notes for
      # this tag", and they had already drifted: the pre-flight accepted a section of pure
      # whitespace that the real extraction would then reject, half an hour of build later.
      - name: Collect the notes
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.resolve.outputs.tag }}"
          version="${{ steps.resolve.outputs.version }}"

          if [ -f "docs/release-notes/$tag.md" ]; then
            cp "docs/release-notes/$tag.md" notes.md
            echo "notes taken from docs/release-notes/$tag.md"
          else
            # Everything between this version's heading and the next one.
            awk -v v="$version" '
              $0 ~ "^## \\[" v "\\]" { on = 1; next }
              on && /^## \[/         { exit }
              on                     { print }
            ' CHANGELOG.md > notes.md
            echo "notes extracted from CHANGELOG.md"
          fi

          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::no release notes for $tag in docs/release-notes/ or CHANGELOG.md"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes.md
          if-no-files-found: error
          retention-days: 14

  build:
    name: Single-file executable
    needs: check
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # No `ref:`. The build is always of the commit this run was started on — the tagged
      # commit on a tag push, the branch head on a dispatch — and the publish job moves the
      # tag to match. Checking out the tag instead is how a re-run kept rebuilding the
      # commit that first carried the tag and kept failing on a bug already fixed.
      - uses: actions/checkout@v4

      # The project has been released from a static Qt since 0.9.5. Qt's own installer
      # ships no static Windows build and aqt cannot fetch one, so this is where a
      # prebuilt one comes from. It is a large package; the cache makes the second run
      # onwards cheap.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          cache: true
          # The libraries after qt6-static are not padding. MSYS2 builds its static Qt
          # against the *system* zlib, libpng, freetype and so on rather than Qt's bundled
          # copies, so Qt6Config still runs find_package on each of them when you consume
          # it — but the package only lists them as build dependencies, so pacman does not
          # pull them in for a consumer. Without libpng, Qt6Gui reports "WrapPNG could not
          # be found", Qt6Widgets reports that Qt6Gui could not be found, and the configure
          # fails with a message that names neither.
          install: >-
            zip
            unzip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-static
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-pcre2
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-libjpeg-turbo
            mingw-w64-x86_64-libtiff
            mingw-w64-x86_64-libwebp
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-harfbuzz
            mingw-w64-x86_64-graphite2
            mingw-w64-x86_64-brotli
            mingw-w64-x86_64-double-conversion
            mingw-w64-x86_64-md4c
            mingw-w64-x86_64-libb2
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-dbus
            mingw-w64-x86_64-vulkan-headers
            mingw-w64-x86_64-vulkan-loader

      - name: Build
        env:
          CC: gcc
          CXX: g++
        run: |
          set -euo pipefail
          # MSYS2's cmake is a native Windows binary and does not read POSIX paths, so the
          # prefix has to be handed over in the form it understands. CMAKE_RC_COMPILER is
          # explicit because a Ninja generator on Windows does not always find windres on
          # its own, and the app icon, the version block and the elevation manifest all
          # reach the executable through app.rc.
          #
          # MSYS2's Qt is static itself, but it was configured -system-zlib,
          # -system-libpng, -system-freetype and so on, and its CMake package resolves each
          # of those through find_package in *this* project. Left alone they resolve to the
          # import libraries and the "single file" comes out wanting fourteen MSYS2 DLLs
          # beside it — libfreetype-6, libharfbuzz-0, libpng16-16, zlib1 and the rest.
          # MSYS2 ships a static archive for every one of them, so the fix is to make
          # find_library look only for those.
          #
          # It has to be set here rather than with -D on the command line: CMake's
          # Platform/Windows-GNU module assigns CMAKE_FIND_LIBRARY_SUFFIXES while project()
          # runs, which overwrites anything handed in from outside. CMAKE_PROJECT_INCLUDE
          # is included at the end of project(), which is after the platform module and
          # before this project's own find_package(Qt6).
          # The second half of the file is the closure. A shared libfreetype-6.dll carries
          # its own dependencies; libfreetype.a does not, and neither MSYS2's CMake config
          # nor Qt's WrapFreetype names them — they live in the .pc file's Libs.private,
          # which find_package never reads. So freetype's harfbuzz, bzip2 and brotli, and
          # OpenSSL's sockets, are listed here. --start-group is not decoration: freetype
          # and harfbuzz each reference the other, and a single pass over the archives
          # cannot satisfy both.
          #
          # Where they go matters as much as that they are there. A static archive only
          # contributes the objects that something already unresolved has asked for, so it
          # has to come *after* everything that needs it. CMAKE_EXE_LINKER_FLAGS lands
          # before the objects and link_libraries() before the target's own libraries;
          # CMAKE_CXX_STANDARD_LIBRARIES is appended at the very end of the command line,
          # which is the only position that works.
          cat > static-deps.cmake <<'CMAKE'
          # Included from the end of project(); see the note in .github/workflows/release.yml.
          set(CMAKE_FIND_LIBRARY_SUFFIXES ".a")
          set(CMAKE_CXX_STANDARD_LIBRARIES
              "-Wl,--start-group -lharfbuzz -lfreetype -lgraphite2 -lbz2 -lbrotlidec -lbrotlicommon -lpng16 -lz -Wl,--end-group -lws2_32 -lcrypt32 -lbcrypt -lsecur32 ${CMAKE_CXX_STANDARD_LIBRARIES}")
          CMAKE

          qt="$(cygpath -m /mingw64/qt6-static)"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$qt" \
            -DCMAKE_RC_COMPILER=windres \
            -DCMAKE_PROJECT_INCLUDE="$(cygpath -m "$PWD/static-deps.cmake")"
          cmake --build build

      - name: Check it is actually a single file
        run: |
          set -euo pipefail
          exe=build/Arbitrium.exe
          test -f "$exe" || { echo "::error::the build produced no executable"; exit 1; }

          # The import table is the only answer that means what it looks like it means, and
          # the test has to be "does every one of these ship with Windows" rather than a
          # list of names to reject. A first attempt only rejected Qt and the MinGW
          # runtime; it passed an executable that still wanted libfreetype-6.dll,
          # libharfbuzz-0.dll, libpng16-16.dll, zlib1.dll and ten more from MSYS2 — a
          # "single file" that runs on this runner and nowhere else.
          #
          # So: look each import up in the Windows system directory. Anything not there is
          # something the user would have to be handed as well, which is the one thing this
          # file is supposed to make unnecessary.
          # api-ms-win-* and ext-ms-* are API sets: the loader resolves them through a
          # schema rather than to a file on disk, so they are part of Windows even though
          # nothing of that name is in System32.
          system="$(cygpath -u "$(cmd //c 'echo %SystemRoot%' | tr -d '\r')")/System32"
          outside=$(objdump -p "$exe" | sed -n 's/^\s*DLL Name: //p' | sort -fu \
                    | while read -r dll; do
                        case "$dll" in
                          api-ms-win-*|ext-ms-*) echo "    ok (api set)  $dll" >&2; continue ;;
                        esac
                        if [ -e "$system/$dll" ]; then
                          echo "    ok            $dll" >&2
                        else
                          echo "    NOT WINDOWS   $dll" >&2
                          echo "$dll"
                        fi
                      done)
          if [ -n "$outside" ]; then
            echo "::error::not a single file — it imports $(echo $outside | tr '\n' ' ')"
            exit 1
          fi

          # Windows reads the elevation request out of RT_MANIFEST before the process
          # exists. Without it half the catalogue fails on the first write.
          grep -qa 'requireAdministrator' "$exe" \
            || { echo "::error::the executable carries no requireAdministrator manifest"; exit 1; }

          bytes=$(stat -c%s "$exe")
          echo "$exe is $bytes bytes"
          # A static Qt Widgets + Svg + Network build lands around 34MB. Anything markedly
          # smaller means Qt did not go in.
          if [ "$bytes" -lt 20000000 ]; then
            echo "::error::$bytes bytes is too small for a static build"
            exit 1
          fi

      - name: Package
        run: |
          set -euo pipefail
          version="${{ needs.check.outputs.version }}"
          exe="Arbitrium-v$version-win64.exe"

          # Two assets, one build. The zip is the same executable under the same name plus
          # the README — which is exactly what 0.9.5, 0.9.6 and 0.9.7 shipped, down to the
          # two entries.
          cp build/Arbitrium.exe "$exe"
          mkdir -p stage
          cp "$exe" README.md stage/
          (cd stage && zip -9 -X "../Arbitrium-v$version-win64.zip" "$exe" README.md)

          ls -l "Arbitrium-v$version-win64.exe" "Arbitrium-v$version-win64.zip"
          unzip -l "Arbitrium-v$version-win64.zip"

      # Kept whether or not this run publishes, so a dry run leaves something to download
      # and open.
      - uses: actions/upload-artifact@v4
        with:
          name: Arbitrium-v${{ needs.check.outputs.version }}-win64
          path: |
            Arbitrium-v${{ needs.check.outputs.version }}-win64.exe
            Arbitrium-v${{ needs.check.outputs.version }}-win64.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish
    needs: [check, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Arbitrium-v${{ needs.check.outputs.version }}-win64

      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Point the tag at the commit that was built
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.check.outputs.tag }}"

          # On a tag push this is already true and the call is a no-op. On a dispatch it is
          # the whole point: the build job checked out this commit, so the tag has to name
          # it too or the release would point at source that was never compiled.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            echo "$tag now points at $GITHUB_SHA"
          else
            echo "$tag does not exist yet; the release step creates it"
          fi

      - name: Publish the release and attach both files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.check.outputs.tag }}"
          version="${{ needs.check.outputs.version }}"
          exe="Arbitrium-v$version-win64.exe"
          zip="Arbitrium-v$version-win64.zip"

          # gh creates the tag itself from --target, which is one less thing to get wrong:
          # `git tag` on a runner needs a committer identity nobody has configured, and
          # this needs no working tree at all.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "Arbitrium $version" --notes-file notes.md
            echo "updated the notes on the existing release"
          else
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "Arbitrium $version" \
              --notes-file notes.md
          fi

          gh release upload "$tag" "$exe" "$zip" --clobber

      - name: Read the assets back off the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.check.outputs.tag }}"
          version="${{ needs.check.outputs.version }}"

          # The release notes name these files too, so anything that greps the release for
          # the name finds a match whether or not the asset is there — asking for the asset
          # list, by name and with its size, is the only answer that means what it looks
          # like it means. This is the check 0.9.8 did not have for the executable.
          gh release view "$tag" --json assets \
            --jq '.assets[] | "\(.name) \(.size)"' > assets.txt
          cat assets.txt

          for name in "Arbitrium-v$version-win64.exe" "Arbitrium-v$version-win64.zip"; do
            size=$(awk -v n="$name" '$1 == n { print $2 }' assets.txt)
            if [ -z "$size" ]; then
              echo "::error::$name is not on the release"
              exit 1
            fi
            if [ "$size" -lt 1000000 ]; then
              echo "::error::$name is on the release but is only $size bytes"
              exit 1
            fi
            echo "$name — $size bytes"
          done
